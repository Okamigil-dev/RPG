<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Tabletop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/@phosphor-icons/web@2.0.3"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div id="top-nav" class="top-nav">
        <div class="nav-left">
            <div class="brand-logo">WORLD VTT0</div>
            <div id="main-nav-tabs" class="nav-tabs hide-default">
                <button onclick="openTab('tab-character')" class="tab-btn"><i class="fa-regular fa-id-card"></i> Character</button>
                <button onclick="openTab('tab-backpack')" class="tab-btn"><i class="ph ph-briefcase"></i> Backpack</button>
                <button onclick="openTab('tab-skills')" class="tab-btn"><i class="fa-solid fa-khanda"></i> Skills</button>
                <button onclick="openTab('tab-control-panel')" id="nav-control-panel" class="tab-btn hide-default"><i class="fa-solid fa-gear"></i> Master</button>
            </div>
        </div>
        <div id="user-header" class="user-header">
            <div class="user-info">
                <div id="user-display-name" class="user-name">Guest</div>
                <div id="user-role-label" class="user-role">Offline</div>
            </div>
            <button onclick="logoutUser()" id="logout-btn" class="btn-danger hide-default">Logout</button>
        </div>
    </div>

    <div class="app-body">
        <div id="sidebar" class="sidebar">
            <div id="active-char-hud" class="active-char-hud hide-default">
                <div class="hud-header">
                    <div id="hud-portrait" class="portrait-circle-small"></div>
                    <div>
                        <h3 id="hud-name" class="hud-name">Unnamed</h3>
                        <span id="hud-meta" class="hud-meta">Lv. 1 Adventurer</span>
                    </div>
                </div>
                
                <div class="hud-resource">
                    <div class="bar-label"><span>HP</span><span id="hud-hp-text">0/0</span></div>
                    <div class="hp-bar-bg"><div id="hud-hp-fill" class="hp-bar-fill"></div></div>
                </div>

                <div class="hud-resource">
                    <div class="bar-label"><span>MP</span><span id="hud-mp-text">0/0</span></div>
                    <div class="mp-bar-bg"><div id="hud-mp-fill" class="mp-bar-fill"></div></div>
                </div>

                <div class="hud-resource">
                    <div class="bar-label"><span>EXP</span></div>
                    <div class="exp-bar-bg"><div id="hud-exp-fill" class="exp-bar-fill"></div></div>
                </div>

                <div class="hud-stats-row">
                    <div class="hud-stat-box"><span>BODY</span><span id="hud-mod-body">+0</span></div>
                    <div class="hud-stat-box"><span>MIND</span><span id="hud-mod-mind">+0</span></div>
                    <div class="hud-stat-box"><span>SPIRIT</span><span id="hud-mod-spirit">+0</span></div>
                </div>
            </div>

            <div id="game-ui" class="game-ui hide-default">
                <div id="date-display" class="date-text">Year 1, Month 1, Day 1</div>
                <div id="time-display" class="time-text">00:00:00</div>
            </div>

            <div class="dice-tray">
                <div id="dice-result" class="dice-result">Roll!</div>
                <div class="dice-grid">
                    <button onclick="rollDice(6)"><i class="fa-solid fa-dice-six"></i><span>d6</span></button>
                    <button onclick="rollDice(20)" class="d20-btn"><i class="fa-solid fa-dice-d20"></i><span>d20</span></button>
                </div>
            </div>
        </div>

        <div id="main-content" class="main-content">
            
            <div id="tab-login" class="tab-content">
                <h2>Log In or Register</h2>
                <div class="login-box">
                    <input type="email" id="email-input" class="form-input" placeholder="Email">
                    <input type="password" id="password-input" class="form-input" placeholder="Password">
                    <button onclick="loginUser()" class="btn-primary btn-full">Log In</button>
                    <button onclick="registerUser()" class="btn-secondary btn-full">Register</button>
                </div>
            </div>

            <div id="tab-character" class="tab-content hide-default">
                
                <div id="char-selection-view">
                    <div class="flex-row">
                        <h2 class="tab-title">Character Dashboard</h2>
                        <button onclick="createNewCharacter()" class="btn-success">New Character</button>
                    </div>
                    <div id="char-list-grid" class="char-list-grid"></div>
                </div>
            
                <div id="char-sheet-view" class="hide-default">
                    <div class="flex-row header-spacing">
                        <button onclick="goBackToSelection()" class="btn-secondary">Back</button>
                        <h2 class="tab-title">Character Sheet</h2>
                    </div>
                    
                    <div class="char-sheet-grid">
                        <div class="stats-resources-wrapper">
                            <div class="panel-card">
                                <h3>Core Stats</h3>
                                <div class="attr-list-grid">
                                    <div class="attr-row"><span>BODY</span><input type="number" id="char-body" onchange="saveCharacter()" class="attr-input"></div>
                                    <div class="attr-row"><span>MIND</span><input type="number" id="char-mind" onchange="saveCharacter()" class="attr-input"></div>
                                    <div class="attr-row"><span>SPIRIT</span><input type="number" id="char-spirit" onchange="saveCharacter()" class="attr-input"></div>
                                </div>
                            </div>
                    
                            <div class="panel-card">
                                <h3>Resources</h3>
                                <div class="resources-grid">
                                    <div class="resource-group">
                                        <label>HP Current / Max</label>
                                        <div class="resource-inputs">
                                            <input type="number" id="char-hp-current" onchange="saveCharacter()" class="hp-input">
                                            <span class="divider">/</span>
                                            <input type="number" id="char-hp-max" onchange="saveCharacter()" class="hp-input">
                                        </div>
                                    </div>
                                    <div class="resource-group">
                                        <label>MP Current / Max</label>
                                        <div class="resource-inputs">
                                            <input type="number" id="char-mp-current" onchange="saveCharacter()" class="hp-input">
                                            <span class="divider">/</span>
                                            <input type="number" id="char-mp-max" onchange="saveCharacter()" class="hp-input">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    
                        <div class="panel-card">
                            <div class="identity-grid">
                                <div class="field-group">
                                    <label>Name</label>
                                    <input type="text" id="char-name" onchange="saveCharacter()" class="form-input">
                                </div>
                                
                                <div class="field-group">
                                    <label>Race</label>
                                    <select id="char-race" onchange="saveCharacter()" class="form-input">
                                        <option value="">Select Race</option>
                                        <option value="Human">Human</option>
                                        <option value="Elf">Elf</option>
                                        <option value="Dwarf">Dwarf</option>
                                        <option value="Orc">Orc</option>
                                    </select>
                                </div>
                                
                                <div class="field-group">
                                    <label>Class</label>
                                    <select id="char-class" onchange="saveCharacter()" class="form-input">
                                        <option value="">Select Class</option>
                                        <option value="Warrior">Warrior</option>
                                        <option value="Mage">Mage</option>
                                        <option value="Rogue">Rogue</option>
                                        <option value="Cleric">Cleric</option>
                                    </select>
                                </div>
                                
                            </div>
                            
                            <div class="level-exp-grid">
                                <div class="field-group">
                                    <label>Lv</label>
                                    <input type="number" id="char-level" onchange="saveCharacter()" class="form-input">
                                </div>
                                <div class="field-group">
                                    <label>Experience (EXP)</label>
                                    <div class="exp-input-wrapper">
                                        <input type="number" id="char-exp-current" onchange="saveCharacter()" class="form-input">
                                        <span class="divider">/</span>
                                        <input type="number" id="char-exp-max" onchange="saveCharacter()" class="form-input">
                                    </div>
                                </div>
                            </div>
                        </div>
                    
                        <div class="panel-card">
                            <h3>Gallery (Max 10 Slots)</h3>
                            <input type="file" id="slot-upload" accept="image/*" class="hide-default" onchange="handleSlotUpload(this)">
                            <div id="char-gallery-grid" class="gallery-grid"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tab-control-panel" class="tab-content hide-default">
                <h2 class="tab-title">Master Control</h2>
                <div class="panel-card">
                    <h3>Time Control</h3>
                    <button onclick="toggleTime()" id="play-btn" class="btn-success">Start Time</button>
                    <span id="speed-label">1x</span>
                    <button onclick="setSpeed(1)" class="btn-small">1x</button>
                    <button onclick="setSpeed(10)" class="btn-small">10x</button>
                    <button onclick="setSpeed(100)" class="btn-small">100x</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
