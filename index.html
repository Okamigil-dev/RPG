<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Clock</title>
    <link rel="stylesheet" href="style.css">
        
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
</head>
<body>

    <div id="auth-container" style="background: #18181b; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; width: 400px; border: 1px solid #27272a;">
        <h2 id="auth-title">Log In or Register</h2>
        <input type="email" id="email-input" placeholder="Email" style="width: 90%; padding: 8px; margin-bottom: 10px; background: #09090b; color: white; border: 1px solid #3f3f46;">
        <input type="password" id="password-input" placeholder="Password" style="width: 90%; padding: 8px; margin-bottom: 10px; background: #09090b; color: white; border: 1px solid #3f3f46;">
        
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button onclick="loginUser()">Log In</button>
            <button onclick="registerUser()">Register</button>
            <button onclick="logoutUser()" id="logout-btn" style="display: none; background: #ef4444;">Log Out</button>
        </div>
            <div id="user-status" style="margin-top: 10px; color: #a1a1aa; font-size: 14px;">Not logged in</div>
    </div>

    <div id="master-panel" style="display: none; border: 2px solid #3b82f6; padding: 15px; border-radius: 10px; margin-top: 20px; background: #18181b;">
        <h3 style="color: #3b82f6; text-align: center; margin-top: 0; margin-bottom: 15px;">Dungeon Master Controls</h3>
        
        <div class="controls" id="time-controls">
            <button onclick="toggleTime()" id="play-btn" class="btn-start">Start Time</button>
            <div class="speed-controls" style="margin-top: 10px;">
                <span>Speed: <span id="speed-label">1x</span></span>
                <button onclick="setSpeed(1)">1x</button>
                <button onclick="setSpeed(10)">10x</button>
                <button onclick="setSpeed(100)">100x</button>
                <button onclick="setSpeed(1000)">1000x</button>
            </div>
        </div>
    </div>
    
    <div id="admin-panel" style="display: none; border: 2px solid #ef4444; padding: 15px; border-radius: 10px; margin-top: 20px; background: #18181b;">
        <h3 style="color: #ef4444; text-align: center; margin-top: 0; margin-bottom: 15px;">Admin World Settings</h3>
        
        <div class="settings" id="time-settings">
            <div class="rule-group">
                <label>Min/Hour: <input type="number" id="min-per-hour" value="60" onchange="updateRules()"></label>
                <label>Hours/Day: <input type="number" id="hours-per-day" value="24" onchange="updateRules()"></label>
                <label>Days/Month: <input type="number" id="days-per-month" value="30" onchange="updateRules()"></label>
                <label>Months/Year: <input type="number" id="months-per-year" value="12" onchange="updateRules()"></label>
            </div>
        </div>
    </div>

    
    <div class="clock-container" id="game-ui" style="display: none;">
        <h2>World Time</h2>
        
        <div class="date-display" id="date-display">Year 1, Month 1, Day 1</div>
        <div class="time-display" id="time-display">00:00:00</div>

    </div>

    <script src="script.js"></script>
</body>
</html>
