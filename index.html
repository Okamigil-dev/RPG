<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Tabletop VTT</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div id="top-nav" class="top-nav">
        
        <div style="display: flex; align-items: center; gap: 20px;">
            <div style="font-weight: bold; color: #00ff88;">WORLD VTT</div>
            <div class="nav-tabs">
                <button onclick="openTab('tab-character')" class="tab-btn">📝 Character</button>
                <button onclick="openTab('tab-backpack')" class="tab-btn">🎒 Backpack</button>
                <button onclick="openTab('tab-skills')" class="tab-btn">⚔️ Skills</button>
                <button onclick="openTab('tab-control-panel')" id="nav-control-panel" class="tab-btn" style="display: none;">⚙️ Master</button>
            </div>
        </div>

        <div id="user-header" style="display: flex; align-items: center; gap: 15px;">
            <div style="text-align: right;">
                <div id="user-display-name" style="font-weight: bold; font-size: 0.9em;">Guest</div>
                <div id="user-role-label" style="font-size: 0.7em; color: #00ff88;">Offline</div>
            </div>
            <div id="nav-user-portrait" style="width: 35px; height: 35px; border-radius: 50%; background: #222; background-size: cover;"></div>
            <button onclick="logoutUser()" id="logout-btn" style="display: none;">Logout</button>
        </div>
    </div>

    <div class="app-body">

        <div id="sidebar" class="sidebar">
            
            <div id="active-char-hud" style="display: none; text-align: center;">
                <div id="portrait-preview" class="portrait-circle" onclick="document.getElementById('portrait-input').click()">
                    <span id="portrait-placeholder" style="font-size: 40px;">👤</span>
                </div>
                <input type="file" id="portrait-input" accept="image/*" style="display: none;" onchange="handlePortraitUpload(event)">
                
                <h3 id="hud-name">Unnamed</h3>
                <div class="hp-bar-bg">
                    <div id="hud-hp-fill" class="hp-bar-fill"></div>
                </div>
                <div style="font-size: 0.8em; color: #a1a1aa;">HP: <span id="hud-hp-text">0 / 0</span></div>
            </div>

            <div style="margin-top: auto;">
                <select id="character-select" onchange="switchCharacter()" style="width: 100%; padding: 8px;">
                    <option value="">-- Switch Character --</option>
                </select>
                <button onclick="createNewCharacter()" style="width: 100%; margin-top: 10px;">+ New Character</button>
            </div>
        </div>

        <div id="main-content" class="main-content">
            <div id="tab-login" class="tab-content">
                <h2>Log In</h2>
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
