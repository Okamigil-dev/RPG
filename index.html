<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Tabletop VTT</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/@phosphor-icons/web@2.0.3"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div id="top-nav" class="top-nav">
        <div class="nav-left">
            <div class="brand-logo">WORLD VTT</div>
            <div id="main-nav-tabs" class="nav-tabs hide-default">
                <button onclick="openTab('tab-character')" class="tab-btn">Character</button>
                <button onclick="openTab('tab-backpack')" class="tab-btn">Backpack</button>
                <button onclick="openTab('tab-skills')" class="tab-btn">Skills</button>
                <button onclick="openTab('tab-control-panel')" id="nav-control-panel" class="tab-btn hide-default">Master</button>
            </div>
        </div>
        <div id="user-header" class="user-header">
            <div id="user-display-name" class="user-name">Guest</div>
            <button onclick="logoutUser()" id="logout-btn" class="btn-danger hide-default">Logout</button>
        </div>
    </div>

    <div class="app-body">
        <div id="sidebar" class="sidebar">
            <div id="active-char-hud" class="active-char-hud hide-default">
                <div id="hud-portrait" class="portrait-circle-small"></div>
                <h3 id="hud-name">Unnamed</h3>
                <div class="hp-bar-bg"><div id="hud-hp-fill" class="hp-bar-fill"></div></div>
                <div id="hud-hp-text" class="hp-text">0 / 0</div>
                <div class="hud-stats-row">
                    <div class="hud-stat-box"><span class="hud-stat-label">B</span><span id="hud-mod-body">+0</span></div>
                    <div class="hud-stat-box"><span class="hud-stat-label">M</span><span id="hud-mod-mind">+0</span></div>
                    <div class="hud-stat-box"><span class="hud-stat-label">S</span><span id="hud-mod-spirit">+0</span></div>
                </div>
            </div>

            <div class="dice-tray">
                <div id="dice-result" class="dice-result">Roll!</div>
                <div class="dice-grid">
                    <button onclick="rollDice(6)"><i class="fa-solid fa-dice-six"></i><span>d6</span></button>
                    <button onclick="rollDice(20)" class="d20-btn"><i class="fa-solid fa-dice-d20"></i><span>d20</span></button>
                </div>
            </div>
        </div>

        <div id="main-content" class="main-content">
            <div id="tab-login" class="tab-content">
                <h2>Login</h2>
                <input type="email" id="email-input" class="form-input" placeholder="Email">
                <input type="password" id="password-input" class="form-input" placeholder="Password">
                <button onclick="loginUser()" class="btn-primary btn-full">Log In</button>
            </div>

            <div id="tab-character" class="tab-content hide-default">
                <div id="char-selection-view">
                    <div class="flex-row">
                        <h2>Characters</h2>
                        <button onclick="createNewCharacter()" class="btn-success">New Character</button>
                    </div>
                    <div id="char-list-grid" class="char-list-grid"></div>
                </div>

                <div id="char-sheet-view" class="hide-default">
                    <button onclick="goBackToSelection()" class="btn-secondary">Back</button>
                    <div class="panel-card">
                        <label>Name</label>
                        <input type="text" id="char-name" onchange="saveCharacter()" class="form-input">
                        <div class="flex-row">
                            <div><label>Body</label><input type="number" id="char-body" onchange="saveCharacter()" class="attr-input"></div>
                            <div><label>Mind</label><input type="number" id="char-mind" onchange="saveCharacter()" class="attr-input"></div>
                            <div><label>Spirit</label><input type="number" id="char-spirit" onchange="saveCharacter()" class="attr-input"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
