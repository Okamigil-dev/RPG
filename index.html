<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Tabletop VTT</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://unpkg.com/@phosphor-icons/web@2.0.3"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div id="top-nav" class="top-nav">
        
        <div class="nav-left">
            <div class="brand-logo">WORLD VTT</div>
            <div id="main-nav-tabs" class="nav-tabs hide-default">
                <button onclick="openTab('tab-character')" class="tab-btn"><i class="fa-regular fa-id-card fa-fw"></i> Character</button>
                <button onclick="openTab('tab-backpack')" class="tab-btn"><i class="ph ph-briefcase"></i> Backpack</button>
                <button onclick="openTab('tab-skills')" class="tab-btn"><i class="fa-solid fa-khanda fa-fw"></i> Skills</button>
                <button onclick="openTab('tab-control-panel')" id="nav-control-panel" class="tab-btn hide-default"><i class="fa-solid fa-gear fa-fw"></i> Master</button>
            </div>
        </div>

        <div id="user-header" class="user-header">
            <div class="user-info">
                <div id="user-display-name" class="user-name">Guest</div>
                <div id="user-role-label" class="user-role">Offline</div>
            </div>
            <div id="nav-user-portrait" class="nav-portrait"></div>
            <button onclick="logoutUser()" id="logout-btn" class="btn-danger hide-default"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </div>

    <div class="app-body">

        <div id="sidebar" class="sidebar">
            
            <div id="active-char-hud" class="active-char-hud hide-default">
                <div id="portrait-preview" class="portrait-circle" onclick="document.getElementById('portrait-input').click()">
                    <span id="portrait-placeholder" class="portrait-placeholder"><i class="ph ph-user"></i></span>
                </div>
                <input type="file" id="portrait-input" accept="image/*" class="hide-default" onchange="handlePortraitUpload(event)">
                
                <h3 id="hud-name" class="hud-name">Unnamed</h3>
                <div class="hp-bar-bg">
                    <div id="hud-hp-fill" class="hp-bar-fill"></div>
                </div>
                <div class="hp-text">HP: <span id="hud-hp-text">0 / 0</span></div>
            </div>

            <div id="game-ui" class="game-ui hide-default">
                <div id="date-display" class="date-text">Year 1, Month 1, Day 1</div>
                <div id="time-display" class="time-text">00:00:00</div>
            </div>

            <div class="dice-grid">
                <button onclick="rollDice(4)" title="d4"><i class="ph ph-triangle"></i></button>
                <button onclick="rollDice(6)" title="d6"><i class="ph ph-square"></i></button>
                <button onclick="rollDice(8)" title="d8"><i class="ph ph-diamond"></i></button>
                <button onclick="rollDice(10)" title="d10"><i class="ph ph-pentagon"></i></button>
                <button onclick="rollDice(12)" title="d12"><i class="ph ph-hexagon"></i></button>
                <button onclick="rollDice(20)" title="d20" class="d20-btn"><i class="ph ph-circle"></i></button>
            </div>
            
            <div class="sidebar-bottom">
                <select id="character-select" class="char-select" onchange="switchCharacter()">
                    <option value="">-- Switch Character --</option>
                </select>
            </div>
        </div>

        <div id="main-content" class="main-content">
            
            <div id="tab-login" class="tab-content">
                <h2>Log In or Register</h2>
                <div class="login-box">
                    <input type="email" id="email-input" class="form-input" placeholder="Email">
                    <input type="password" id="password-input" class="form-input" placeholder="Password">
                    
                    <button id="login-btn" onclick="loginUser()" class="btn-primary btn-full"><i class="fa-solid fa-right-to-bracket"></i> Log In</button>
                    <button id="register-btn" onclick="registerUser()" class="btn-secondary btn-full"><i class="fa-solid fa-user-plus"></i> Register</button>
                </div>
            </div>
            
            
            
            <!-- 1. CHARACTER TAB -->
            
            <div id="tab-character" class="tab-content hide-default">
                
                <div id="char-selection-view">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #06b6d4; padding-bottom: 10px; margin-bottom: 20px;">
                        <h2 class="tab-title" style="border: none; margin: 0;">Select Character</h2>
                        <button onclick="createNewCharacter()" class="btn-success"><i class="ph ph-plus"></i> New Character</button>
                    </div>
                    
                    <div id="char-list-grid" class="char-list-grid">
                        </div>
                </div>
            
                <div id="char-sheet-view" class="hide-default">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #06b6d4; padding-bottom: 10px; margin-bottom: 20px;">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <button onclick="goBackToSelection()" class="btn-secondary btn-small"><i class="ph ph-arrow-left"></i> Back</button>
                            <h2 class="tab-title" style="border: none; margin: 0;">Character Sheet</h2>
                        </div>
                        <div id="sheet-header-info" style="color: #a1a1aa; font-size: 0.9em;"></div>
                    </div>
            
                    <div class="char-sheet-grid">
                        </div>
                    
                    <div class="panel-card" style="margin-top: 20px;">
                         </div>
                </div>
            </div>

            

            <!-- 2. BACKPACK TAB -->
            
            <div id="tab-backpack" class="tab-content hide-default">
                <h2>Backpack</h2>
            </div>



            <!-- 3. SKILLS TAB -->
            <div id="tab-skills" class="tab-content hide-default">
                <h2>Skills & Abilities</h2>
            </div>



            <!-- 0. CONTROL PANEL TAB -->
            <div id="tab-control-panel" class="tab-content hide-default">
                <h2 class="tab-title master-title">Master Control Panel</h2>
                
                <div id="master-panel" class="panel-card master-panel hide-default">
                    <h3 class="master-title-small">Live Game Controls</h3>
                    <button onclick="toggleTime()" id="play-btn" class="btn-success"><i class="fa-solid fa-play"></i> Start Time</button>
                    <span class="speed-label-text">Speed: <span id="speed-label">1x</span></span>
                    <button onclick="setSpeed(1)" class="btn-small">1x</button>
                    <button onclick="setSpeed(10)" class="btn-small">10x</button>
                    <button onclick="setSpeed(100)" class="btn-small">100x</button>
                </div>

                <div id="admin-panel" class="panel-card admin-panel hide-default">
                    <h3 class="admin-title-small">World Physics & Rules</h3>
                    <label>Min/Hour: <input type="number" id="min-per-hour" class="physics-input" value="60" onchange="updateRules()"></label>
                    <label class="physics-label">Hours/Day: <input type="number" id="hours-per-day" class="physics-input" value="24" onchange="updateRules()"></label>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
