<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Tabletop VTT</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div id="top-nav" class="top-nav">
        
        <div style="display: flex; align-items: center; gap: 20px;">
            <div style="font-weight: bold; color: #00ff88;">WORLD VTT</div>
            <div class="nav-tabs">
                <button onclick="openTab('tab-character')" class="tab-btn">📝 Character</button>
                <button onclick="openTab('tab-backpack')" class="tab-btn">🎒 Backpack</button>
                <button onclick="openTab('tab-skills')" class="tab-btn">⚔️ Skills</button>
                <button onclick="openTab('tab-control-panel')" id="nav-control-panel" class="tab-btn" style="display: none;">⚙️ Master</button>
            </div>
        </div>

        <div id="user-header" style="display: flex; align-items: center; gap: 15px;">
            <div style="text-align: right;">
                <div id="user-display-name" style="font-weight: bold; font-size: 0.9em;">Guest</div>
                <div id="user-role-label" style="font-size: 0.7em; color: #00ff88;">Offline</div>
            </div>
            <div id="nav-user-portrait" style="width: 35px; height: 35px; border-radius: 50%; background: #222; background-size: cover;"></div>
            <button onclick="logoutUser()" id="logout-btn" style="display: none;">Logout</button>
        </div>
    </div>

    <div class="app-body">

        <div id="sidebar" class="sidebar">
            
            <div id="active-char-hud" style="display: none; text-align: center;">
                <div id="portrait-preview" class="portrait-circle" onclick="document.getElementById('portrait-input').click()">
                    <span id="portrait-placeholder" style="font-size: 40px;">👤</span>
                </div>
                <input type="file" id="portrait-input" accept="image/*" style="display: none;" onchange="handlePortraitUpload(event)">
                
                <h3 id="hud-name">Unnamed</h3>
                <div class="hp-bar-bg">
                    <div id="hud-hp-fill" class="hp-bar-fill"></div>
                </div>
                <div style="font-size: 0.8em; color: #a1a1aa;">HP: <span id="hud-hp-text">0 / 0</span></div>
            </div>

            <div style="margin-top: auto;">
                <select id="character-select" onchange="switchCharacter()" style="width: 100%; padding: 8px;">
                    <option value="">-- Switch Character --</option>
                </select>
                <button onclick="createNewCharacter()" style="width: 100%; margin-top: 10px; padding: 10px; background: #10b981; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">+ New Character</button>
            </div>
        </div>

        <div id="main-content" class="main-content">
            
            <div id="tab-login" class="tab-content">
                <h2>Log In or Register</h2>
                <div style="max-width: 320px;">
                    <input type="email" id="email-input" placeholder="Email" style="width: 100%; margin-bottom: 10px;">
                    <input type="password" id="password-input" placeholder="Password" style="width: 100%; margin-bottom: 20px;">
                    
                    <button id="login-btn" onclick="loginUser()" style="width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; margin-bottom: 10px;">Log In</button>
                    <button id="register-btn" onclick="registerUser()" style="width: 100%; padding: 10px; background: transparent; color: #a1a1aa; border: 1px solid #27272a;">Register</button>
                </div>
            </div>
            
            <div id="tab-character" class="tab-content" style="display: none;">
                <h2 style="color: #06b6d4; border-bottom: 2px solid #06b6d4; padding-bottom: 10px; margin-top: 0;">Character Management</h2>

                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-top: 20px;">
                    <div style="background: #18181b; padding: 20px; border-radius: 8px; border: 1px solid #27272a;">
                        <h3 style="margin-top: 0; color: #a1a1aa; text-align: center; border-bottom: 1px solid #3f3f46; padding-bottom: 10px;">Attributes</h3>
                        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; background: #27272a; padding: 10px; border-radius: 6px;">
                                <span style="font-weight: bold; color: #ef4444;">STR</span>
                                <input type="number" id="char-str" onchange="saveCharacter()" value="10" style="width: 50px; text-align: center;">
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; background: #27272a; padding: 10px; border-radius: 6px;">
                                <span style="font-weight: bold; color: #10b981;">DEX</span>
                                <input type="number" id="char-dex" onchange="saveCharacter()" value="10" style="width: 50px; text-align: center;">
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; background: #27272a; padding: 10px; border-radius: 6px;">
                                <span style="font-weight: bold; color: #f59e0b;">CON</span>
                                <input type="number" id="char-con" onchange="saveCharacter()" value="10" style="width: 50px; text-align: center;">
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; background: #27272a; padding: 10px; border-radius: 6px;">
                                <span style="font-weight: bold; color: #3b82f6;">INT</span>
                                <input type="number" id="char-int" onchange="saveCharacter()" value="10" style="width: 50px; text-align: center;">
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; background: #27272a; padding: 10px; border-radius: 6px;">
                                <span style="font-weight: bold; color: #8b5cf6;">WIS</span>
                                <input type="number" id="char-wis" onchange="saveCharacter()" value="10" style="width: 50px; text-align: center;">
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; background: #27272a; padding: 10px; border-radius: 6px;">
                                <span style="font-weight: bold; color: #ec4899;">CHA</span>
                                <input type="number" id="char-cha" onchange="saveCharacter()" value="10" style="width: 50px; text-align: center;">
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 20px;">
                        <div style="background: #18181b; padding: 20px; border-radius: 8px; border: 1px solid #27272a; display: flex; gap: 15px;">
                            <div style="flex-grow: 1;">
                                <label style="color: #a1a1aa; font-size: 0.8em; text-transform: uppercase;">Character Name</label>
                                <input type="text" id="char-name" onchange="saveCharacter()" placeholder="Enter name..." style="width: 100%; margin-top: 5px;">
                            </div>
                            <div style="width: 80px;">
                                <label style="color: #a1a1aa; font-size: 0.8em; text-transform: uppercase;">Level</label>
                                <input type="number" id="char-level" onchange="saveCharacter()" value="1" style="width: 100%; margin-top: 5px; text-align: center;">
                            </div>
                        </div>

                        <div style="background: #18181b; padding: 20px; border-radius: 8px; border: 1px solid #27272a; text-align: center;">
                            <h4 style="margin: 0 0 10px 0; color: #10b981; font-size: 1.2em;">Hit Points</h4>
                            <div style="display: flex; justify-content: center; align-items: center; gap: 15px;">
                                <input type="number" id="char-hp-current" onchange="saveCharacter()" placeholder="Cur" style="width: 80px; text-align: center;">
                                <span style="font-size: 1.5em;">/</span>
                                <input type="number" id="char-hp-max" onchange="saveCharacter()" placeholder="Max" style="width: 80px; text-align: center;">
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
                            <div style="background: #18181b; padding: 15px; border-radius: 8px; border: 1px solid #27272a; text-align: center;">
                                <label style="color: #a1a1aa; font-size: 0.8em;">AC</label>
                                <input type="number" id="char-ac" onchange="saveCharacter()" value="10" style="width: 100%; border: none; text-align: center; font-size: 1.2em;">
                            </div>
                            <div style="background: #18181b; padding: 15px; border-radius: 8px; border: 1px solid #27272a; text-align: center;">
                                <label style="color: #a1a1aa; font-size: 0.8em;">INIT</label>
                                <input type="number" id="char-init" onchange="saveCharacter()" value="0" style="width: 100%; border: none; text-align: center; font-size: 1.2em;">
                            </div>
                            <div style="background: #18181b; padding: 15px; border-radius: 8px; border: 1px solid #27272a; text-align: center;">
                                <label style="color: #a1a1aa; font-size: 0.8em;">SPEED</label>
                                <input type="number" id="char-speed" onchange="saveCharacter()" value="30" style="width: 100%; border: none; text-align: center; font-size: 1.2em;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tab-backpack" class="tab-content" style="display: none;">
                <h2>Backpack</h2>
            </div>

            <div id="tab-skills" class="tab-content" style="display: none;">
                <h2>Skills & Abilities</h2>
            </div>

            <div id="tab-control-panel" class="tab-content" style="display: none;">
                <h2 style="color: #3b82f6; border-bottom: 2px solid #3b82f6; padding-bottom: 10px;">Master Control Panel</h2>
                
                <div id="master-panel" style="display: none; border: 1px solid #3b82f6; padding: 20px; background: #18181b; border-radius: 8px; margin-top: 20px;">
                    <h3 style="margin-top: 0; color: #3b82f6;">Live Game Controls</h3>
                    <button onclick="toggleTime()" id="play-btn" style="padding: 10px 20px; background: #10b981; color: white; border: none;">Start Time</button>
                    <span style="margin-left: 15px;">Speed: <span id="speed-label">1x</span></span>
                    <button onclick="setSpeed(1)" style="padding: 5px 10px;">1x</button>
                    <button onclick="setSpeed(10)" style="padding: 5px 10px;">10x</button>
                    <button onclick="setSpeed(100)" style="padding: 5px 10px;">100x</button>
                </div>

                <div id="admin-panel" style="display: none; border: 1px solid #ef4444; padding: 20px; background: #18181b; border-radius: 8px; margin-top: 20px;">
                    <h3 style="margin-top: 0; color: #ef4444;">World Physics & Rules</h3>
                    <label>Min/Hour: <input type="number" id="min-per-hour" value="60" onchange="updateRules()" style="width: 50px;"></label>
                    <label style="margin-left: 10px;">Hours/Day: <input type="number" id="hours-per-day" value="24" onchange="updateRules()" style="width: 50px;"></label>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
